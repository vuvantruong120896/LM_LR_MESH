; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; LoRaMesh Unified Application
; Gateway Mode Environment (default)
[env:esp32-gateway]
platform = espressif32
framework = arduino
; Use an ESP32 board that exposes 8MB flash and PSRAM (WROVER module)
board = esp-wrover-kit
monitor_speed = 115200

; Flash configuration for 4MB with custom OTA partitions
; Gateway uses external flash/PSRAM (8MB) and OTA-capable partition table
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = partitions_custom_gateway.csv

; Dependencies
lib_deps = 
    jgromes/RadioLib@^6.6.0
    bblanchon/ArduinoJson@^7.0.4
    mobizt/Firebase ESP32 Client@^4.4.17
    h2zero/NimBLE-Arduino@^1.4.2

; Include paths for components and applications
build_flags =
    -D CORE_DEBUG_LEVEL=5
    -D DEVICE_MODE=2
    -D CONFIG_LOG_COLORS=1
    -D ENABLE_MESH_SECURITY
    -D DEBUG_SKIP_MAC_VERIFICATION
    -I src/components/lora_mesh_manager/include
    -I src/components/lora_mesh_manager/src/core
    -I src/components/lora_mesh_manager/src/radio
    -I src/components/lora_mesh_manager/src/network
    -I src/components/lora_mesh_manager/src/services
    -I src/components/lora_mesh_manager/src/utilities
    -I src/components/button_led/include
    -I src/application/common
    -I src/application/app_gateway

; Source filter - include components and applications, but exclude individual main files
build_src_filter = 
    +<components/>
    +<services/>
    +<application/common/>
    +<application/app_node/>
    +<application/app_gateway/>
    +<main.cpp>



[env:esp32-node]
platform = espressif32
framework = arduino
board = esp32doit-devkit-v1
monitor_speed = 115200

; Dependencies (Node only needs RadioLib, no Firebase or WiFi dependencies)
lib_deps = 
    jgromes/RadioLib@^6.6.0

; Flash configuration for 4MB with custom OTA partitions
; Node environment keeps original 4MB layout and does not need OTA
board_build.flash_size = 4MB
board_build.partitions = partitions_custom_node.csv

; Include paths for components and applications  
build_flags =
    -D CORE_DEBUG_LEVEL=5
    -D DEVICE_MODE=3
    -D CONFIG_LOG_COLORS=0
    -D CONFIG_LOG_TIMESTAMP_SOURCE_NONE
    -D ENABLE_MESH_SECURITY
    -D DEBUG_SKIP_MAC_VERIFICATION
    -I src/components/lora_mesh_manager/include
    -I src/components/lora_mesh_manager/src/core
    -I src/components/lora_mesh_manager/src/radio
    -I src/components/lora_mesh_manager/src/network
    -I src/components/lora_mesh_manager/src/services
    -I src/components/lora_mesh_manager/src/utilities
    -I src/components/button_led/include
    -I src/application/common
    -I src/application/app_node

; Source filter - EXCLUDE app_gateway directory (gateway-specific code with Firebase)
build_src_filter = 
    +<components/>
    +<application/common/>
    +<application/app_node/>
    -<application/app_gateway/>
    +<main.cpp>