    -I src/components/lora_mesh_manager/include
    -I src/components/lora_mesh_manager/src/core
    -I src/components/lora_mesh_manager/src/radio
    -I src/components/lora_mesh_manager/src/network
    -I src/components/lora_mesh_manager/src/services
    -I src/components/lora_mesh_manager/src/utilities
    -I src/components/button_led/include
