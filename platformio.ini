; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-gateway]
platform = espressif32
framework = arduino
board = 4d_systems_esp32s3_gen4_r8n16
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions_custom_gateway.csv
lib_deps = 
	jgromes/RadioLib@^6.6.0
	bblanchon/ArduinoJson@^7.0.4
	mobizt/Firebase ESP32 Client@^4.4.17
	h2zero/NimBLE-Arduino@^1.4.2
build_flags = 
	-D CORE_DEBUG_LEVEL=5
	-D DEVICE_MODE=2
	-D CONFIG_LOG_COLORS=1
	-D ENABLE_MESH_SECURITY
	-D DEBUG_SKIP_MAC_VERIFICATION
	-D USE_CELLULAR  ; Cellular mode enabled - HTTPS Firebase via A7682S modem
	-I src/components/lora_mesh_manager/include
	-I src/components/lora_mesh_manager/src/core
	-I src/components/lora_mesh_manager/src/radio
	-I src/components/lora_mesh_manager/src/network
	-I src/components/lora_mesh_manager/src/services
	-I src/components/lora_mesh_manager/src/utilities
	-I src/components/cellular/include
	-I src/components/button_led/include
	-I src/components/rs485_soil_sensor/include
	-I src/application/common
	-I src/application/app_gateway
build_src_filter = 
	+<components/>
	+<components/rs485_soil_sensor/>
	+<services/>
	+<utils/>
	+<application/common/>
	+<application/app_node/>
	+<application/app_gateway/>
	+<main.cpp>

[env:esp32-node]
platform = espressif32
framework = arduino
board = 4d_systems_esp32s3_gen4_r8n16
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions_custom_node.csv
lib_deps = 
	jgromes/RadioLib@^6.6.0
	bblanchon/ArduinoJson@^7.0.4
	h2zero/NimBLE-Arduino@^1.4.2
build_flags = 
	-D CORE_DEBUG_LEVEL=5
	-D DEVICE_MODE=3
	-D CONFIG_LOG_COLORS=0
	-D CONFIG_LOG_TIMESTAMP_SOURCE_NONE
	-D ENABLE_MESH_SECURITY
	-D DEBUG_SKIP_MAC_VERIFICATION
	-I src/components/lora_mesh_manager/include
	-I src/components/lora_mesh_manager/src/core
	-I src/components/lora_mesh_manager/src/radio
	-I src/components/lora_mesh_manager/src/network
	-I src/components/lora_mesh_manager/src/services
	-I src/components/lora_mesh_manager/src/utilities
	-I src/components/button_led/include
	-I src/components/rs485_soil_sensor/include
	-I src/application/common
	-I src/application/app_node
	-I src/application/app_gateway
build_src_filter = 
	+<components/lora_mesh_manager/>
	+<components/button_led/>
	+<components/rs485_soil_sensor/>
	-<components/cellular/>
	+<utils/>
	+<application/common/>
	+<application/app_node/>
	-<application/app_gateway/>
	+<application/app_gateway/crypto_utils.cpp>
	+<main.cpp>

[env:esp32-handheld]
platform = espressif32
framework = arduino
board = 4d_systems_esp32s3_gen4_r8n16
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions_custom_node.csv
lib_deps = 
	bblanchon/ArduinoJson@^7.0.4
	mobizt/Firebase ESP32 Client@^4.4.17
build_flags = 
	-D CORE_DEBUG_LEVEL=5
	-D DEVICE_MODE=4
	-D CONFIG_LOG_COLORS=1
	-D ENABLE_HANDHELD_MODE
	-D USE_TFT_DISPLAY
	-D USER_SETUP_LOADED=1
	-D ILI9341_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MOSI=19
	-D TFT_MISO=16
	-D TFT_SCLK=18
	-D TFT_CS=5
	-D TFT_DC=46
	-D TFT_RST=4
	-D TFT_BL=17
	-D SPI_FREQUENCY=20000000
	-D SPI_READ_FREQUENCY=10000000
	-D LOAD_GLCD
	-D LOAD_FONT2
	-I src/components/rs485_soil_sensor/include
	-I src/components/button_led/include
	-I src/components/tft_display/include
	-I src/components/tft_display
	-I src/components/lora_mesh_manager/include
	-I src/application/common
	-I src/application/app_handheld
build_src_filter = 
	+<components/rs485_soil_sensor/>
	+<components/button_led/>
	+<components/tft_display/>
	-<components/cellular/>
	-<components/lora_mesh_manager/>
	-<utils/>
	+<utils/battery_monitor.cpp>
	-<application/common/>
	+<application/app_handheld/>
	-<application/app_gateway/>
	+<main.cpp>
	+<main.cpp>

[env:esp32-display-test]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions_custom_node.csv
lib_deps = 
	; Removing TFT_eSPI temporarily to test basic GPIO/SPI
	; bodmer/TFT_eSPI@^2.5.43

build_flags = 
	-D CORE_DEBUG_LEVEL=3
	-D BOARD_HAS_PSRAM=0
	-D CONFIG_SPIRAM_SUPPORT=0
	-D CONFIG_SPIRAM_BOOT_INIT=0
	-D CONFIG_SPIRAM=0
	-D USER_SETUP_LOADED=1
	-D ILI9341_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MISO=16
	-D TFT_MOSI=19
	-D TFT_SCLK=18
	-D TFT_CS=5
	-D TFT_RST=4
	-D TFT_BL=17
	-D TFT_DC=46
	-D TOUCH_ENABLED=0
	-I src/application/app_handheld
build_src_filter = 
	+<test_display.cpp>
	-<components/>
	-<services/>
	-<utils/>
	-<application/>
	-<main.cpp>

