; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; LoRaMesh Unified Application
; Configure DEVICE_MODE in build_flags:
;   -D DEVICE_MODE=1  -> Node Mode (default)
;   build_flags = -D DEVICE_MODE=2  ; 1=Node, 2=Bridge

[env:esp32-c3-devkitm-1]
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200

; Dependencies
lib_deps = 
    jgromes/RadioLib@^6.6.0

; Include paths for components and applications
build_flags =
    -D CORE_DEBUG_LEVEL=5
    -D DEVICE_MODE=1
    -D ENABLE_MESH_SECURITY
    -I src/components/lora_mesh_manager/include
    -I src/components/lora_mesh_manager/src/core
    -I src/components/lora_mesh_manager/src/radio
    -I src/components/lora_mesh_manager/src/network
    -I src/components/lora_mesh_manager/src/services
    -I src/components/lora_mesh_manager/src/utilities
    -I src/components/button_led/include
    -I src/application/common
    -I src/application/app_bridge

; Source filter - include components and applications, but exclude individual main files
build_src_filter = 
    +<components/>
    +<application/common/>
    +<application/app_node/>
    +<application/app_bridge/>
    -<application/common/led_control.cpp>
    -<application/app_node/main_node.cpp>
    -<application/app_bridge/main_bridge.cpp>
    +<main.cpp>
