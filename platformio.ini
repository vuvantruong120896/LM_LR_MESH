[env:esp32-node]
platform = espressif32
framework = arduino
board = esp32doit-devkit-v1
monitor_speed = 115200

; Dependencies
lib_deps = 
    jgromes/RadioLib@^6.6.0

; Include paths for components and applications  
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D DEVICE_MODE=3
    -D CONFIG_LOG_COLORS=0
    -D CONFIG_LOG_TIMESTAMP_SOURCE_NONE
    -D ENABLE_MESH_SECURITY
    -D DEBUG_SKIP_MAC_VERIFICATION
    -I src/components/lora_mesh_manager/include
    -I src/components/lora_mesh_manager/src/core
    -I src/components/lora_mesh_manager/src/radio
    -I src/components/lora_mesh_manager/src/network
    -I src/components/lora_mesh_manager/src/services
    -I src/components/lora_mesh_manager/src/utilities
    -I src/components/button_led/include
    -I src/application/common
    -I src/application/app_node

; Source filter - include components and applications, but exclude individual main files
build_src_filter = 
    +<components/>
    +<application/common/>
    +<application/app_node/>
    +<application/app_bridge/>
    -<application/common/led_control.cpp>
    -<application/app_node/main_node.cpp>
    -<application/app_bridge/main_bridge.cpp>
    +<main.cpp>